x-redis: &redis
  image: redis:7.4-bookworm
  command: [redis-server, --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --appendonly, 'no', --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
  healthcheck:
    test: [CMD, redis-cli, ping]
    interval: 2s
    timeout: 2s
    retries: 30
  restart: unless-stopped
x-minio: &minio
  build:
    context: .
    dockerfile: deploy/minio.Dockerfile
  image: ruxredock-minio:local
  command: [server, --console-address, ':9001', 'http://minio{1...4}/data{1...2}']
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruxredock-local}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-password}
  healthcheck:
    test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
    interval: 5s
    timeout: 5s
    retries: 60
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ruxredock
      POSTGRES_USER: ruxredock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruxredock-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/tests.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ruxredock -d ruxredock']
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  redis1:
    <<: *redis
  redis2:
    <<: *redis
  redis3:
    <<: *redis
  redis4:
    <<: *redis
  redis5:
    <<: *redis
  redis6:
    <<: *redis
  redis-init:
    image: redis:7.4-bookworm
    depends_on:
      redis1: {condition: service_healthy}
      redis2: {condition: service_healthy}
      redis3: {condition: service_healthy}
      redis4: {condition: service_healthy}
      redis5: {condition: service_healthy}
      redis6: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if ! redis-cli -h redis1 cluster info | grep -q 'cluster_state:ok'; then
          redis-cli --cluster create redis1:6379 redis2:6379 redis3:6379 redis4:6379 redis5:6379 redis6:6379 --cluster-replicas 1 --cluster-yes
        fi
        for attempt in $$(seq 1 60); do
          if redis-cli -h redis1 cluster info | grep -q 'cluster_state:ok'; then exit 0; fi
          sleep 1
        done
        exit 1
  minio1:
    <<: *minio
    volumes: [minio1-data1:/data1, minio1-data2:/data2]
  minio2:
    <<: *minio
    volumes: [minio2-data1:/data1, minio2-data2:/data2]
  minio3:
    <<: *minio
    volumes: [minio3-data1:/data1, minio3-data2:/data2]
  minio4:
    <<: *minio
    volumes: [minio4-data1:/data1, minio4-data2:/data2]
  storage:
    image: nginx:1.28-bookworm
    volumes: [./deploy/minio-nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      minio1: {condition: service_healthy}
      minio2: {condition: service_healthy}
      minio3: {condition: service_healthy}
      minio4: {condition: service_healthy}
    restart: unless-stopped
  bucket-init:
    build:
      context: .
      dockerfile: deploy/bucket.Dockerfile
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ruxredock
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ruxredock-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-development-password}
    depends_on:
      storage: {condition: service_started}
  api:
    build: .
    ports: ['127.0.0.1:8080:8080']
    environment:
      DATABASE_URL: postgres://ruxredock:${POSTGRES_PASSWORD:-ruxredock-local}@postgres:5432/ruxredock
      REDIS_URLS: redis://redis1:6379,redis://redis2:6379,redis://redis3:6379
      REDIS_CLUSTER: 'true'
      CACHE_NAMESPACE: ruxredock:compose:v1
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ruxredock
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ruxredock-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-development-password}
      DEDUP_SCOPE: tenant
      MIN_RESPONSE_MS: '40'
      SIMULATED_BYTES_PER_SECOND: '20971520'
    depends_on:
      postgres: {condition: service_healthy}
      redis-init: {condition: service_completed_successfully}
      bucket-init: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  postgres-data:
  minio1-data1:
  minio1-data2:
  minio2-data1:
  minio2-data2:
  minio3-data1:
  minio3-data2:
  minio4-data1:
  minio4-data2:
