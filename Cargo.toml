[package]
name = "RuxRedock"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["wasm"]
resolver = "2"

[dependencies]
axum = "0.8"
futures-util = "0.3"
hex = "0.4"
object_store = { version = "0.12", features = ["aws"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "cluster-async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
